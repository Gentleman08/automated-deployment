name: Monorepo DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/student-management-backend
  BACKEND_IMAGE_TAG: ${{ github.sha }}
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
  HAS_SONAR: ${{ secrets.SONAR_TOKEN != '' && vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' }}
  HAS_SNYK: ${{ secrets.SNYK_TOKEN != '' }}
  HAS_DOCKER: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
  HAS_AZURE: ${{ secrets.AZURE_CREDENTIALS != '' }}
  HAS_ACA_VARS: ${{ vars.ACA_RESOURCE_GROUP != '' && vars.ACA_APP_NAME != '' }}

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  preflight:
    name: Integration Preflight
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - name: Print Path Trigger Summary
        run: |
          echo "Frontend changed: ${{ needs.changes.outputs.frontend }}"
          echo "Backend changed:  ${{ needs.changes.outputs.backend }}"

      - name: Publish Integration Readiness
        run: |
          echo "## DevSecOps Integration Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Cloudflare Pages | ${{ env.HAS_CLOUDFLARE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SonarCloud | ${{ env.HAS_SONAR }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk | ${{ env.HAS_SNYK }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub Push | ${{ env.HAS_DOCKER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Azure Login | ${{ env.HAS_AZURE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ACA Vars | ${{ env.HAS_ACA_VARS }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Path Filters" >> $GITHUB_STEP_SUMMARY
          echo "- frontend/** changed: ${{ needs.changes.outputs.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "- backend/** changed: ${{ needs.changes.outputs.backend }}" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend Build and Cloudflare Deploy
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: student-mgmt-frontend
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend Security Gates and Deploy
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'TempStrong!Passw0rd1' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -C || exit 1"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit and Integration Tests
        env:
          DB_SERVER: localhost
          DB_PORT: 1433
          DB_USER: sa
          DB_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'TempStrong!Passw0rd1' }}
        run: npm test --if-present

      - name: SonarCloud Scan
        if: env.HAS_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: backend
          args: >-
            -Dsonar.sources=.
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

      - name: Snyk Dependency Scan
        if: env.HAS_SNYK == 'true'
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --file=backend/package.json --json-file-output=backend/snyk-report.json

      - name: Upload Snyk Report Artifact
        if: always() && env.HAS_SNYK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: backend/snyk-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t $BACKEND_IMAGE_NAME:$BACKEND_IMAGE_TAG .

      - name: Run Backend Container for DAST
        run: |
          docker run -d --rm --name backend-under-test --network host \
            -e PORT=5000 \
            -e JWT_SECRET=test_secret_for_dast \
            $BACKEND_IMAGE_NAME:$BACKEND_IMAGE_TAG

      - name: Wait for Backend Readiness
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health >/dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker logs backend-under-test || true
          exit 1

      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/zap-report
          chmod 777 ${{ github.workspace }}/zap-report
          docker run --rm --network host \
            -v ${{ github.workspace }}/zap-report:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -r zap-report.html -I

      - name: Upload ZAP Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-report
          path: zap-report/zap-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Backend Test Container
        if: always()
        run: docker rm -f backend-under-test || true

      - name: Trivy Image Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE_NAME }}:${{ env.BACKEND_IMAGE_TAG }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-report.sarif
          exit-code: "1"

      - name: Upload Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Log In to Docker Hub
        if: github.ref == 'refs/heads/main' && env.HAS_DOCKER == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        if: github.ref == 'refs/heads/main' && env.HAS_DOCKER == 'true'
        run: |
          docker push $BACKEND_IMAGE_NAME:$BACKEND_IMAGE_TAG
          docker tag $BACKEND_IMAGE_NAME:$BACKEND_IMAGE_TAG $BACKEND_IMAGE_NAME:latest
          docker push $BACKEND_IMAGE_NAME:latest

      - name: Azure Login
        if: github.ref == 'refs/heads/main' && env.HAS_AZURE == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        if: github.ref == 'refs/heads/main' && env.HAS_AZURE == 'true' && env.HAS_ACA_VARS == 'true' && env.HAS_DOCKER == 'true'
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ vars.ACA_RESOURCE_GROUP }}
          containerAppName: ${{ vars.ACA_APP_NAME }}
          imageToDeploy: ${{ env.BACKEND_IMAGE_NAME }}:${{ env.BACKEND_IMAGE_TAG }}
